<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Automation control panel</title>
  <desc id="desc">A control panel showing data moving through an automation workflow</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#25334A"/></pattern>
  </defs>

  <path d="M18 0H1182L1200 18V282L1182 300H18L0 282V18L18 0Z" fill="#0B1220"/>
  <path d="M18 1H1182L1199 18V282L1182 299H18L1 282V18L18 1Z" stroke="#334155" stroke-width="2"/>
  <path d="M18 0H1182L1200 18V282L1182 300H18L0 282V18L18 0Z" fill="url(#dots)" opacity="0.55"/>
  <path d="M1 113H1199" stroke="#25334A"/>

  <rect x="42" y="30" width="6" height="50" rx="3" fill="#38BDF8"/>
  <text x="68" y="48" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">AUTOMATION ENGINEERING</text>
  <text x="68" y="78" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">From repetitive tasks to reliable workflows.</text>
  <text x="68" y="99" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Connect data, apply rules, run the job, and deliver the result.</text>
  <g transform="translate(1015 39)">
    <rect width="142" height="34" rx="17" fill="#0F291E" stroke="#236B4A"/>
    <circle cx="20" cy="17" r="5" fill="#4ADE80"/>
    <text x="35" y="22" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SYSTEM READY</text>
  </g>

  <path d="M258 196H338M518 196H598M778 196H858" stroke="#38BDF8" stroke-width="3"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(78 145)">
      <rect width="180" height="102" rx="10" fill="#111B2E" stroke="#2B4465"/><rect width="180" height="4" rx="2" fill="#38BDF8"/>
      <text x="16" y="29" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.6">01 / INPUT</text>
      <path d="M20 48H38V66H20V48ZM43 52H59M43 61H54" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round"/>
      <text x="72" y="58" fill="#E2E8F0" font-size="16" font-weight="650">Capture</text><text x="16" y="87" fill="#94A3B8" font-size="12">API · Form · Message</text>
    </g>
    <g transform="translate(338 145)">
      <rect width="180" height="102" rx="10" fill="#111B2E" stroke="#3E3A67"/><rect width="180" height="4" rx="2" fill="#A78BFA"/>
      <text x="16" y="29" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.6">02 / RULES</text>
      <path d="M21 56L29 64L45 47M52 51H63M52 61H59" stroke="#C4B5FD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="58" fill="#E2E8F0" font-size="16" font-weight="650">Validate</text><text x="16" y="87" fill="#94A3B8" font-size="12">Check · Filter · Route</text>
    </g>
    <g transform="translate(598 145)">
      <rect width="180" height="102" rx="10" fill="#111B2E" stroke="#5C4823"/><rect width="180" height="4" rx="2" fill="#FBBF24"/>
      <text x="16" y="29" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.6">03 / ACTION</text>
      <path d="M22 49H42V65H22V49ZM47 49H62M47 57H58M47 65H54" stroke="#FCD34D" stroke-width="2.2" stroke-linecap="round"/>
      <text x="72" y="58" fill="#E2E8F0" font-size="16" font-weight="650">Process</text><text x="16" y="87" fill="#94A3B8" font-size="12">Bot · AI · Database</text>
    </g>
    <g transform="translate(858 145)">
      <rect width="180" height="102" rx="10" fill="#111B2E" stroke="#26563F"/><rect width="180" height="4" rx="2" fill="#4ADE80"/>
      <text x="16" y="29" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.6">04 / OUTPUT</text>
      <path d="M21 49H43V64H35L32 68L29 64H21V49ZM49 53H62M49 61H57" stroke="#86EFAC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="58" fill="#E2E8F0" font-size="16" font-weight="650">Deliver</text><text x="16" y="87" fill="#94A3B8" font-size="12">Report · Alert · Update</text>
    </g>
  </g>
  <g transform="translate(1080 145)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="16" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1.4">RUN LOG</text>
    <text x="0" y="42" fill="#4ADE80" font-size="12">● success</text><text x="0" y="64" fill="#94A3B8" font-size="12">04 steps</text><text x="0" y="86" fill="#94A3B8" font-size="12">0 errors</text>
  </g>
</svg>
