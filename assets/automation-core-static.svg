<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Automation workflow</title>
  <desc id="desc">A minimal workflow moving from trigger to notification</desc>

  <rect x="1" y="1" width="1198" height="258" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M1 48H1199" stroke="#30363D"/>
  <circle cx="25" cy="24" r="5" fill="#FF7B72"/>
  <circle cx="43" cy="24" r="5" fill="#D29922"/>
  <circle cx="61" cy="24" r="5" fill="#3FB950"/>
  <text x="88" y="30" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="15">workflow.run()</text>
  <circle cx="1085" cy="24" r="5" fill="#3FB950"/>
  <text x="1098" y="30" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="14">ready</text>

  <text x="64" y="88" fill="#F0F6FC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Automation workflow</text>
  <text x="64" y="111" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="14">A small system doing one job reliably, from input to notification.</text>

  <path d="M170 170H1030" stroke="#30363D" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 170H1030" stroke="#58A6FF" stroke-width="4" stroke-linecap="round"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(170 170)">
      <circle r="24" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
      <path d="M-7-9L10 0L-7 9V-9Z" fill="#58A6FF"/>
      <text x="0" y="46" text-anchor="middle" fill="#C9D1D9" font-size="14" font-weight="600">Trigger</text>
      <text x="0" y="66" text-anchor="middle" fill="#8B949E" font-size="12">event received</text>
    </g>
    <g transform="translate(455 170)">
      <circle r="24" fill="#161B22" stroke="#A371F7" stroke-width="2"/>
      <path d="M-10 0L-3 7L11-8" stroke="#A371F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="46" text-anchor="middle" fill="#C9D1D9" font-size="14" font-weight="600">Validate</text>
      <text x="0" y="66" text-anchor="middle" fill="#8B949E" font-size="12">rules checked</text>
    </g>
    <g transform="translate(745 170)">
      <circle r="24" fill="#161B22" stroke="#D29922" stroke-width="2"/>
      <path d="M-10-6H10M-10 0H6M-10 6H2" stroke="#D29922" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="46" text-anchor="middle" fill="#C9D1D9" font-size="14" font-weight="600">Process</text>
      <text x="0" y="66" text-anchor="middle" fill="#8B949E" font-size="12">task completed</text>
    </g>
    <g transform="translate(1030 170)">
      <circle r="24" fill="#161B22" stroke="#3FB950" stroke-width="2"/>
      <path d="M-10-8H10V7H3L0 11L-3 7H-10V-8Z" stroke="#3FB950" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="0" y="46" text-anchor="middle" fill="#C9D1D9" font-size="14" font-weight="600">Notify</text>
      <text x="0" y="66" text-anchor="middle" fill="#8B949E" font-size="12">result delivered</text>
    </g>
  </g>
</svg>
